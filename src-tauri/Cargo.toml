[package]
name = "everydoing"
version = "0.2.0"
edition = "2021"
default-run = "everydoing"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = "0.4"
ntfs-reader = "0.4"
walkdir = "2"
dirs = "5"
opener = "0.7"
rfd = "0.15"
arboard = "3"
reqwest = { version = "0.12", features = ["json"] }
getrandom = "0.3"

[profile.release]
strip = true
